version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: joodpakpaw_frontend
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    networks:
      - catbnb-network
    restart: always

networks:
  catbnb-network:
    external: true
