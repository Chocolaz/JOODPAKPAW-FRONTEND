name: Deploy Frontend to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: 10.4.88.39
          username: sysadmin
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd ~/JOODPAKPAW-FRONTEND
            ./deploy.sh
