name: Deploy to VM on merge to main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted # เปลี่ยนจาก ubuntu-latest เป็น self-hosted runner

    steps:
      # 1️⃣ ดึง code ล่าสุดจาก repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ ติดตั้ง Node.js เวอร์ชัน 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ สร้างไฟล์ .env.production สำหรับ frontend
      - name: Create .env.production
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=http://cp25nk2.sit.kmutt.ac.th:8000/" > .env.production

      # 4️⃣ Deploy ไป VM ผ่าน SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: 10.4.88.39 # private IP ของ VM
          username: sysadmin # user บน VM
          key: ${{ secrets.VM_SSH_KEY }} # private key ของ sysadmin
          port: 22
          script: |
            cd ~/JOODPAKPAW-FRONTEND
            ./deploy.sh
